services:
  db:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: rpt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realtime_tracker
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./server/database/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realtime_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpt-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: realtime_tracker
    # REMOVED: ports: - "3030:3030"
    # The app now ONLY listens on localhost:3000 (accessible only via SSH tunnel from local machine)
    # The agent container communicates via Docker internal network (localhost:3000 within container)
    restart: unless-stopped

volumes:
  timescale_data: